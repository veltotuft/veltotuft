    body {

      color: #F67280;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      margin-bottom: 1em;
    }

    p {
      font-size: 1.3rem;
      color: #EED3F5;
      max-width: 700px;
      padding: 0 1rem;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.2);
    }

    /* Responsive styles */
    @media (max-width: 600px) {
      h1 {
        font-size: 2.8rem;
      }

      h2 {
        font-size: 1.8rem;
      }
