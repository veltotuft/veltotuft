<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velto – Tuft Coming Soon</title>
  <!-- Playfair Display from Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #4D0000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2rem 3rem;
      text-align: center;
      color: #F2D3CC;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="glass">
    <h1>Velto</h1>
    <p>Tuft is coming to cut through the ordinary</p>
  </div>
</body>
</html>
